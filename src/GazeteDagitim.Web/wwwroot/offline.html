<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <title>Bağlantı yok - Gazete Dağıtım</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: radial-gradient(circle at 50% 0%, #3a0015, #050506 62%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 430px);
      border: 1px solid #34343c;
      border-radius: 22px;
      padding: 34px 24px;
      background: linear-gradient(145deg, #18181c, #0b0b0d);
      box-shadow: 0 24px 58px rgb(0 0 0 / 55%);
    }
    .icon {
      display: grid;
      width: 72px;
      height: 72px;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #c40046, #710029);
      font-size: 2rem;
    }
    h1 { margin: 0; font-size: 1.55rem; }
    p { margin: 12px 0 22px; color: #b4b4bd; line-height: 1.55; }
    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      padding: 10px 18px;
      background: #a9003b;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #fb3f79; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">↻</div>
    <h1>İnternet bağlantısı yok</h1>
    <p>Güncel dağıtım ve ödeme bilgilerini gösterebilmek için internete bağlanmanız gerekiyor. Bağlantı geldikten sonra yeniden deneyin.</p>
    <a href="/menu">Yeniden dene</a>
  </main>
</body>
</html>
